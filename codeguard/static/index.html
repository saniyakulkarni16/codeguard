<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeGuard</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6a737d; --line:#d8dee4; --card:#f6f8fa; --hl:#fff3b0; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --card:#161b22; --hl:#5a4a00; --accent:#58a6ff; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { margin:0 0 4px; } h2 { margin:28px 0 8px; font-size:18px; }
  .muted { color:var(--muted); }
  form { display:flex; flex-wrap:wrap; gap:12px; align-items:end; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:16px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  input[type=email], input[type=password], input[type=number] { padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); min-width:220px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 18px; font-size:14px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.small { padding:3px 10px; font-size:12px; }
  button:disabled { opacity:.5; cursor:wait; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; font-size:13px; }
  th, td { border:1px solid var(--line); padding:4px 8px; text-align:center; white-space:nowrap; }
  td.cell { cursor:pointer; min-width:48px; }
  tr.pair { cursor:pointer; } tr.pair:hover { background:var(--card); }
  .badge { padding:1px 8px; border-radius:10px; font-size:12px; color:#fff; }
  .high { background:#d1242f; } .medium { background:#bf8700; } .low { background:#2da44e; }
  .st-done { background:#2da44e; } .st-failed { background:#d1242f; } .st-pending, .st-running { background:#6a737d; }
  .diff { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pane { border:1px solid var(--line); border-radius:8px; overflow:hidden; min-width:0; }
  .pane h3 { margin:0; padding:8px 12px; font-size:13px; background:var(--card); border-bottom:1px solid var(--line); }
  .code { margin:0; overflow:auto; max-height:520px; font:12.5px/1.5 ui-monospace,monospace; }
  .ln { display:flex; } .ln span:first-child { width:40px; flex:none; text-align:right; padding-right:8px; color:var(--muted); user-select:none; }
  .ln span:last-child { white-space:pre; padding-right:12px; }
  .ln.match { background:var(--hl); }
  .msg { margin-top:12px; } .err { color:#d1242f; }
  @media (max-width:760px) { .diff { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>CodeGuard</h1>
      <div class="muted">Detects copied Python code even after renaming, reformatting or reordering.</div>
    </div>
    <div id="who" hidden><span id="email" class="muted"></span> <button class="secondary small" id="logout">Log out</button></div>
  </header>

  <section id="auth">
    <form id="authForm">
      <label>Email <input type="email" id="authEmail" required autocomplete="username"></label>
      <label>Password (min 8 characters) <input type="password" id="authPw" required minlength="8" autocomplete="current-password"></label>
      <button type="submit" id="loginBtn">Log in</button>
      <button type="button" class="secondary" id="registerBtn">Create account</button>
    </form>
  </section>

  <section id="app" hidden>
    <form id="form">
      <label>Submissions (.py files or one .zip)
        <input type="file" id="files" multiple accept=".py,.zip" required></label>
      <label>Starter code to ignore (optional)
        <input type="file" id="template" accept=".py"></label>
      <label>Min score to report
        <input type="number" id="min" value="0.2" min="0" max="1" step="0.05"></label>
      <button id="go" type="submit">Analyze</button>
    </form>

    <h2>History</h2>
    <div id="history" class="scroll"></div>
    <div id="out"></div>
  </section>

  <div id="msg" class="msg"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => n.append(k));
  return n;
};
const color = (s) => `hsl(${Math.round(120 - 120 * s)}, 70%, 70%)`; // green (low) -> red (high)
const say = (text, isErr = false) => { const m = $("msg"); m.textContent = text; m.className = "msg" + (isErr ? " err" : " muted"); };

/* ---------- auth + API helper ---------- */
const TOKEN_KEY = "cg_token";
let token = localStorage.getItem(TOKEN_KEY);

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers, token ? { Authorization: `Bearer ${token}` } : {});
  const res = await fetch(path, opts);
  if (res.status === 401 && token) { logout(); throw new Error("Session expired. Please log in again."); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(Array.isArray(d) ? d.map((x) => x.msg).join("; ") : d || "Request failed");
  }
  return data;
}

async function login(email, password) {
  const data = await api("/api/auth/login", { method: "POST", body: new URLSearchParams({ username: email, password }) });
  token = data.access_token;
  localStorage.setItem(TOKEN_KEY, token);
  await enterApp();
}

function logout() {
  token = null;
  localStorage.removeItem(TOKEN_KEY);
  $("auth").hidden = false; $("app").hidden = true; $("who").hidden = true;
  $("out").replaceChildren(); $("history").replaceChildren();
}

async function enterApp() {
  const me = await api("/api/auth/me");
  $("email").textContent = me.email;
  $("auth").hidden = true; $("app").hidden = false; $("who").hidden = false;
  say("");
  await loadHistory();
}

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try { await login($("authEmail").value, $("authPw").value); $("authPw").value = ""; }
  catch (err) { say(err.message, true); }
});
$("registerBtn").addEventListener("click", async () => {
  if (!$("authForm").reportValidity()) return;
  try {
    await api("/api/auth/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("authEmail").value, password: $("authPw").value }) });
    await login($("authEmail").value, $("authPw").value);
    $("authPw").value = "";
  } catch (err) { say(err.message, true); }
});
$("logout").addEventListener("click", logout);

/* ---------- jobs ---------- */
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("out").replaceChildren(); say("");
  const fd = new FormData();
  [...$("files").files].forEach((f) => fd.append("files", f));
  if ($("template").files[0]) fd.append("template", $("template").files[0]);
  fd.append("min_score", $("min").value);
  $("go").disabled = true;
  try {
    const { id } = await api("/api/jobs", { method: "POST", body: fd });
    await loadHistory();
    await watch(id);
  } catch (err) { say(err.message, true); }
  finally { $("go").disabled = false; }
});

async function watch(id) {
  say("Analyzing…");
  for (;;) {                                   // poll until the background worker finishes
    const job = await api(`/api/jobs/${id}`);
    if (job.status === "done") { say(""); showJob(job); loadHistory(); return; }
    if (job.status === "failed") { loadHistory(); throw new Error(job.error || "Analysis failed"); }
    await new Promise((r) => setTimeout(r, 1000));
  }
}

function showJob(job) {
  $("out").replaceChildren();
  render({ ...job.report, sources: job.sources });
  $("out").scrollIntoView({ behavior: "smooth" });
}

async function loadHistory() {
  const jobs = await api("/api/jobs");
  const box = $("history");
  if (!jobs.length) { box.replaceChildren(el("p", { className: "muted" }, "No analyses yet.")); return; }
  const rows = jobs.map((j) => el("tr", {},
    el("td", {}, new Date(j.created_at).toLocaleString()),
    el("td", {}, String(j.file_count)),
    el("td", {}, el("span", { className: `badge st-${j.status}` }, j.status)),
    el("td", {}, j.max_score == null ? "–" : (j.max_score * 100).toFixed(0) + "%"),
    el("td", {},
      el("button", { className: "secondary small", disabled: j.status !== "done",
        onclick: async () => { try { showJob(await api(`/api/jobs/${j.id}`)); } catch (e) { say(e.message, true); } } }, "Open"),
      " ",
      el("button", { className: "secondary small",
        onclick: async () => { try { await api(`/api/jobs/${j.id}`, { method: "DELETE" }); await loadHistory(); } catch (e) { say(e.message, true); } } }, "Delete"))));
  box.replaceChildren(el("table", {},
    el("thead", {}, el("tr", {}, ...["Date", "Files", "Status", "Top match", ""].map((h) => el("th", {}, h)))),
    el("tbody", {}, ...rows)));
}

/* ---------- report rendering ---------- */
function render(d) {
  const out = $("out");
  out.append(el("p", { className: "muted" },
    `${d.names.length} files · scored ${d.compared} of ${d.total_pairs} pairs (the inverted index skips pairs with no shared fingerprints)`));

  out.append(el("h2", {}, "Flagged pairs"));
  const body = el("tbody");
  d.pairs.forEach((p) => body.append(
    el("tr", { className: "pair", onclick: () => showDiff(d, p) },
      el("td", {}, el("span", { className: `badge ${p.verdict}` }, p.verdict)),
      el("td", {}, (p.score * 100).toFixed(0) + "%"),
      el("td", {}, p.token_score.toFixed(2)),
      el("td", {}, p.ast_score === null ? "–" : p.ast_score.toFixed(2)),
      el("td", {}, p.file_a), el("td", {}, p.file_b))));
  if (!d.pairs.length) out.append(el("p", {}, "No pairs above the threshold."));
  else out.append(el("div", { className: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, ...["Verdict", "Score", "Token", "AST", "File A", "File B"].map((h) => el("th", {}, h)))),
    body)));

  out.append(el("h2", {}, "Similarity matrix"), matrix(d));
  out.append(el("div", { id: "diff" }));
  if (d.pairs[0]) showDiff(d, d.pairs[0], false);
}

function matrix(d) {
  const head = el("tr", {}, el("th"), ...d.names.map((n, i) => el("th", { title: n }, i + 1)));
  const rows = d.names.map((n, i) => el("tr", {}, el("th", { title: n }, `${i + 1}. ${n}`),
    ...d.matrix[i].map((s, j) => {
      const td = el("td", { className: "cell", title: `${d.names[i]} vs ${d.names[j]}: ${s}` }, s.toFixed(2));
      td.style.background = i === j ? "transparent" : color(s);
      td.style.color = i === j ? "inherit" : "#000";
      const pair = d.pairs.find((p) => (p.file_a === d.names[i] && p.file_b === d.names[j]) ||
                                       (p.file_a === d.names[j] && p.file_b === d.names[i]));
      if (i !== j && pair) td.onclick = () => showDiff(d, pair);
      return td;
    })));
  return el("div", { className: "scroll" }, el("table", {}, el("thead", {}, head), el("tbody", {}, ...rows)));
}

function pane(title, source, regions) {
  const hit = new Set();
  regions.forEach(([a, b]) => { for (let l = a; l <= b; l++) hit.add(l); });
  const code = el("pre", { className: "code" });
  source.split("\n").forEach((line, i) => code.append(
    el("div", { className: "ln" + (hit.has(i + 1) ? " match" : "") },
      el("span", {}, i + 1), el("span", {}, line))));   // textContent only: no HTML injection
  return el("div", { className: "pane" }, el("h3", {}, title), code);
}

function showDiff(d, p, scroll = true) {
  const box = $("diff");
  box.replaceChildren(
    el("h2", {}, `Side by side: ${(p.score * 100).toFixed(0)}% similar`),
    el("div", { className: "diff" },
      pane(p.file_a, d.sources[p.file_a], p.regions_a),
      pane(p.file_b, d.sources[p.file_b], p.regions_b)));
  if (scroll) box.scrollIntoView({ behavior: "smooth" });
}

/* ---------- startup: reuse a saved token if it is still valid ---------- */
if (token) enterApp().catch(() => logout());
</script>
</body>
</html>
